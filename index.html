<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solar System | Interactive Visualization</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="universe">
        <!-- Stars background -->
        <div class="stars" id="stars"></div>
        
        <!-- Solar system container -->
        <div class="solar-system" id="solarSystem">
            <!-- Sun -->
            <div class="sun" id="sun">
                <span class="planet-name">Sun</span>
            </div>
            
            <!-- Orbits and planets will be generated by JavaScript -->
        </div>
        
        <!-- Controls -->
        <div class="controls">
            <button id="pauseBtn" class="control-btn">⏸️ Pause</button>
            <button id="resetBtn" class="control-btn">🔄 Reset</button>
            <button id="infoBtn" class="control-btn">ℹ️ Info</button>
        </div>
        
        <!-- Planet info panel -->
        <div class="info-panel" id="infoPanel">
            <button class="close-btn" id="closePanel">&times;</button>
            <h2 id="planetName">Planet Name</h2>
            <div class="planet-stats">
                <p><strong>Distance from Sun:</strong> <span id="distance">-</span></p>
                <p><strong>Orbital Period:</strong> <span id="orbitalPeriod">-</span></p>
                <p><strong>Day Length:</strong> <span id="dayLength">-</span></p>
                <p><strong>Moons:</strong> <span id="moons">-</span></p>
                <p><strong>Temperature:</strong> <span id="temperature">-</span></p>
            </div>
            <p class="fun-fact" id="funFact">-</p>
        </div>
        
        <!-- Title -->
        <h1 class="title">Solar System</h1>
        <p class="subtitle">Click on any planet to learn more</p>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
