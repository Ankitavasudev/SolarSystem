<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Solar System — Interactive 3D Orrery</title>
  <meta name="description" content="An interactive 3D solar system: real orbital periods, procedurally generated planets, and click-to-explore data. Built with Three.js." />
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='28' fill='%23ffcc55'/><ellipse cx='50' cy='50' rx='46' ry='18' fill='none' stroke='%2300adb5' stroke-width='4'/></svg>" />
</head>
<body>
  <canvas id="scene"></canvas>

  <header class="hud hud-top">
    <h1>Solar<span>System</span></h1>
    <p class="sub">Orbital periods at true relative speed · drag to orbit · scroll to zoom</p>
  </header>

  <div class="hud hud-controls">
    <button id="toggle" class="btn" aria-pressed="false">Pause</button>
    <label class="speed">
      <span>Speed</span>
      <input id="speed" type="range" min="0" max="4" step="0.1" value="1" aria-label="Animation speed" />
      <output id="speedOut">1.0×</output>
    </label>
    <button id="reset" class="btn">Reset view</button>
  </div>

  <nav class="hud hud-nav" id="nav" aria-label="Jump to planet"></nav>

  <aside class="panel" id="panel" hidden>
    <button class="panel-close" id="panelClose" aria-label="Close">&times;</button>
    <div class="panel-head">
      <span class="dot" id="panelDot"></span>
      <h2 id="panelName">Planet</h2>
    </div>
    <dl class="stats">
      <div><dt>Distance from Sun</dt><dd id="dDist">—</dd></div>
      <div><dt>Orbital period</dt><dd id="dPeriod">—</dd></div>
      <div><dt>Diameter</dt><dd id="dDia">—</dd></div>
      <div><dt>Day length</dt><dd id="dDay">—</dd></div>
      <div><dt>Moons</dt><dd id="dMoons">—</dd></div>
      <div><dt>Mean temperature</dt><dd id="dTemp">—</dd></div>
    </dl>
    <p class="fact" id="dFact"></p>
  </aside>

  <p class="hint" id="hint">Click any planet to inspect it</p>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    }
  }
  </script>
  <script type="module" src="script.js"></script>
</body>
</html>
